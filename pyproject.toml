[project]
name = "bidtriage"
version = "0.1.0"
description = "ITB triage, fit scoring and morning digest for Ferry Electric's estimators"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "typer>=0.12",
    "apscheduler>=3.10,<4",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "cryptography>=43",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pdf2image>=1.17"]

[project.scripts]
bidtriage = "bidtriage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-python-dateutil",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["postgres: requires a running PostgreSQL (DATABASE_URL)", "network: calls external APIs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["bidtriage"]
mypy_path = "src"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.importlinter]
root_package = "bidtriage"

[[tool.importlinter.contracts]]
name = "core has no upward imports"
type = "forbidden"
source_modules = ["bidtriage.core"]
forbidden_modules = [
    "bidtriage.ingestion", "bidtriage.extraction", "bidtriage.resolution", "bidtriage.scoring",
    "bidtriage.gcs", "bidtriage.digest", "bidtriage.decisions", "bidtriage.calendar",
    "bidtriage.web", "bidtriage.worker",
]

[[tool.importlinter.contracts]]
name = "pure domain modules never import delivery layers"
type = "forbidden"
source_modules = ["bidtriage.scoring", "bidtriage.resolution", "bidtriage.extraction", "bidtriage.ingestion"]
forbidden_modules = ["bidtriage.web", "bidtriage.worker", "bidtriage.digest"]
