[alembic]
script_location = migrations
prepend_sys_path = src
# Alembic 1.16 warns without this and falls back to splitting `prepend_sys_path` on spaces, commas
# and colons, which would break the moment a path contains one.
path_separator = os
sqlalchemy.url = postgresql+psycopg://bidtriage:bidtriage@localhost:5432/bidtriage

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
